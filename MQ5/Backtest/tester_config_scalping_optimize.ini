; ===================================================================
; MT5 Strategy Tester - headless GENETIC OPTIMIZATION (round 3) for the
; XAUUSD Scalping & Session EA. Used via:
;   terminal64.exe /config:tester_config_scalping_optimize.ini
;
; Round 1 (risk params only) found weak edge (best PF ~1.08) because the
; entry logic itself was too noisy at the time. Reworked the entry logic
; (v3: fresh-cross + genuine RSI dip for trend mode), then round 2 (added
; RSI/BB shape params) found real edge: best pass PF 1.46, Net Profit
; $392.71, Max DD 6.56%, 328 trades (~2.5/day) - but 5 of 9 searched
; parameters landed on the EDGE of their search range (InpAdxThreshold=30
; upper, InpBbDeviation=2.5 upper, InpRsiPullbackDeepLow=25 lower,
; InpRsiOversold=35 upper, InpAtrSlMultRange=0.8 lower), meaning the true
; optimum may lie outside what round 2 could see. Round 3 widens exactly
; those 5 ranges to search past their round-2 boundary.
; ===================================================================

[Tester]
Expert=XAUUSD_Scalping_EA
Symbol=XAUUSD
Period=M5
; Model: 0=Every tick  1=1-minute OHLC  2=Open prices only  3=Math calculations  4=Every tick (based on real ticks)
Model=4
FromDate=2026.02.11
ToDate=2026.08.11
ForwardMode=0
Deposit=1000
Currency=USD
Leverage=100
ExecutionMode=0
; Optimization: 0=disabled 1=slow complete algorithm 2=fast genetic algorithm
Optimization=2
; OptimizationCriterion: 5=Custom max (uses EA's OnTester() return value)
OptimizationCriterion=5
Report=XAUUSD_Scalping_Optimize
ReplaceReport=1
ShutdownTerminal=1
Visual=0

; value||start||step||stop||Y-or-N  (Y = included in the optimization search)
