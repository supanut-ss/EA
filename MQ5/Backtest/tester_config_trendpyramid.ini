; ===================================================================
; MT5 Strategy Tester - headless config for XAUUSD_TrendPyramidEA
; (uploaded EA, not yet reviewed/tuned - running with its own defaults
; as a first baseline backtest)
; Used via:  terminal64.exe /config:tester_config_trendpyramid.ini
; ===================================================================

[Tester]
Expert=XAUUSD_TrendPyramidEA
Symbol=XAUUSD
Period=M5
; Model: 0=Every tick  1=1-minute OHLC  2=Open prices only  3=Math calculations  4=Every tick (based on real ticks)
Model=4
FromDate=2026.01.01
ToDate=2026.08.14
ForwardMode=0
Deposit=1000
Currency=USD
Leverage=100
ExecutionMode=0
Optimization=0
Report=XAUUSD_TrendPyramid_Report
ReplaceReport=1
ShutdownTerminal=1
Visual=0

; Explicit inputs - MT5 silently prefers MQL5\Profiles\Tester\<Expert>.set
; (auto-saved from the previous run) over compiled-in defaults whenever this
; section is absent, so every parameter used by the EA must be listed here
; to guarantee the test actually uses what this file says.
[TesterInputs]
FastEMA=50
SlowEMA=200
RSI_Period=14
RSI_BuyMin=45.0
RSI_BuyMax=70.0
RSI_SellMax=55.0
RSI_SellMin=30.0
ATR_Period=14
SL_ATR_Multiplier=1.5
TP_ATR_Multiplier=3.0
UseTrailingStop=true
Trail_Start_ATR=1.0
Trail_Distance_ATR=1.0
RiskPercentPerTrade=1.0
MaxTotalRiskPercent=3.0
MinLot=0.01
MaxLot=5.0
DailyLossLimitPercent=3.0
MaxPositions=3
PyramidStep_ATR=1.0
AllowPyramiding=true
MaxSpreadPoints=350
UseSessionFilter=true
SessionStartHour=7
SessionEndHour=21
MagicNumber=20260814
TradeComment=XAUUSD_TrendPyramidEA
