; ===================================================================
; MT5 Strategy Tester - headless config for the StopGrid backtest harness
; Used via:  terminal64.exe /config:tester_config_stopgrid.ini
;
; This runs XAUUSD_OneClick_StopGrid_EA_BacktestHarness (Backtest folder),
; NOT the production XAUUSD_OneClick_StopGrid_EA. The harness is the
; production EA plus a bolted-on block that simulates the manual Magic-0
; entries the real EA expects a human to place, since the Strategy Tester
; can only ever run one Expert and has no human clicking Buy/Sell.
;
; SECURITY: do NOT put your account password in this file if this
; folder is committed to git.
; ===================================================================

[Tester]
Expert=XAUUSD_OneClick_StopGrid_EA_BacktestHarness
Symbol=XAUUSD
Period=M15
; Model: 0=Every tick  1=1-minute OHLC  2=Open prices only  3=Math calculations  4=Every tick (based on real ticks)
Model=4
FromDate=2026.01.01
ToDate=2026.08.13
ForwardMode=0
Deposit=5000
Currency=USD
Leverage=100
ExecutionMode=0
Optimization=0
Report=XAUUSD_StopGrid_Harness_v143_Report
ReplaceReport=1
ShutdownTerminal=1
Visual=0

[TesterInputs]
InpDebugAutoEntry=true
InpDebugManualLot=0.02
InpDebugCooldownBars=20
InpDebugDirectionMode=0
InpOrdersPerSide=5
InpPriceStepCents=200
InpFixedLotUnit=0.01
InpStopLossDistance=0.0
InpTakeProfitDistance=0.0
InpUseFormulaClose=true
InpUseRecoveryFormula=true
InpTrailArmCents=200
InpRecoverySLArmCents=130
InpProtectSpreadBuffer=0.050
InpWinnerCutCount=3
InpMaxLosersBeforeCut=2
InpLoserCutMoveCents=165
InpMagicNumber=20260904
InpSlippagePoints=100
InpMaxSpreadPrice=0.20
InpExpirationHours=0
InpMaxOwnPendingOrders=100
InpMinMarginLevelPercent=300.0
InpMinManualLot=0.0
InpMaxManualLot=0.0
InpMaxConcurrentBaskets=0
InpGridRetrySeconds=60
InpPostCutGraceCents=400
