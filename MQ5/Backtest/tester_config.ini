; ===================================================================
; MT5 Strategy Tester - headless config for XAUUSD Trend/Breakout EA
; Used via:  terminal64.exe /config:tester_config.ini
;
; SECURITY: do NOT put your account password in this file if this
; folder is committed to git. Leave Password commented out - as long
; as this MT5 terminal already has the account logged in / remembers
; it, the tester can normally still run using cached login + cached
; history. If MT5 insists on a password, set it locally only and add
; this file to .gitignore before committing anything else.
; ===================================================================

[Tester]
Expert=XAUUSD_TrendBreakout_EA
Symbol=XAUUSD
Period=M15
; Model: 0=Every tick  1=1-minute OHLC  2=Open prices only  3=Math calculations  4=Every tick (based on real ticks)
Model=4
FromDate=2026.01.01
ToDate=2026.08.13
ForwardMode=0
Deposit=1000
Currency=USD
Leverage=100
ExecutionMode=0
Optimization=0
Report=XAUUSD_TrendBreakout_Report
ReplaceReport=1
ShutdownTerminal=1
Visual=0

; Explicit inputs - MT5 silently prefers MQL5\Profiles\Tester\<Expert>.set
; (auto-saved from the previous run) over compiled-in defaults whenever this
; section is absent, so every parameter used by the EA must be listed here
; to guarantee the test actually uses what this file says.
[TesterInputs]
InpLotSize=0.01
InpMagicNumber=20260811
InpSlippage=20
InpMaxOpenPositions=1
InpMaxTradesPerDay=6
InpTrendTF=16385
InpEmaFast=50
InpEmaSlow=200
InpAdxPeriod=14
InpAdxThreshold=20.0
InpEntryTF=15
InpDonchianPeriod=8
InpAtrPeriod=14
InpAtrBufferMult=0.30
InpAtrSlMult=1.5
InpRiskReward=1.8
InpUseTrailing=true
InpTrailAtrMult=1.2
; Breakeven and the loss-streak guards were backtested on this exact range and both
; HURT this EA (see the input comments in XAUUSD_TrendBreakout_EA.mq5 for numbers).
; Kept listed but disabled so a future run does not silently pick them up.
InpUseBreakeven=false
InpBETriggerAtrMult=1.0
InpBELockPoints=20
InpUseDailyLossGuard=false
InpMaxDailyLosses=3
InpUseLossCooldown=false
InpLossCooldownMins=75
InpSessionStartHour=6
InpSessionEndHour=23
InpAvoidFriday=true
InpFridayCutoffHour=20
InpAvoidSunday=true
InpMaxSpreadPoints=350.0
