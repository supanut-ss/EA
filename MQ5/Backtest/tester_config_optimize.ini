; ===================================================================
; MT5 Strategy Tester - headless GENETIC OPTIMIZATION for the
; XAUUSD Trend/Breakout EA. Used via: terminal64.exe /config:tester_config_optimize.ini
;
; Optimizes toward the custom OnTester() score in the EA (profit,
; scaled down unless trades/day lands near 2-3 and drawdown stays
; contained) instead of raw balance, so the top results already
; balance profit vs. frequency vs. drawdown the way we want.
;
; NOTE (2026.08.11): tried on this machine with 8 local tester agents -
; progress stalled at ~2% after 5 min regardless of search-space size
; (tested both a ~6720-combo and a ~270-combo space, same stall). Root
; cause: only ~2.8 GB RAM was free out of 15.4 GB total, and each agent
; needs ~900 MB+ for the tick data, so agents thrash instead of running
; in parallel. Close other apps / free RAM (or reduce Agent count in
; MT5 Tools > Options > Strategy Tester Agents) before relying on this -
; otherwise a manual single-pass sweep via tester_config.ini is faster.
; ===================================================================

[Tester]
Expert=XAUUSD_TrendBreakout_EA
Symbol=XAUUSD
Period=M15
; Model: 0=Every tick  1=1-minute OHLC  2=Open prices only  3=Math calculations  4=Every tick (based on real ticks)
Model=4
FromDate=2026.02.11
ToDate=2026.08.11
ForwardMode=0
Deposit=1000
Currency=USD
Leverage=100
ExecutionMode=0
; Optimization: 0=disabled 1=slow complete algorithm 2=fast genetic algorithm
Optimization=2
; OptimizationCriterion: 0=Balance max 1=Profit Factor max 2=Expected Payoff max
; 3=Drawdown min 4=Balance/Drawdown max 5=Custom max (uses EA's OnTester() return
; value) 6=Complex Criterion max
OptimizationCriterion=5
Report=XAUUSD_TrendBreakout_Optimize
ReplaceReport=1
ShutdownTerminal=1
Visual=0

; value||start||step||stop||Y-or-N  (Y = included in the optimization search)
[TesterInputs]
InpLotSize=0.01||0.01||0.001000||0.100000||N
InpMagicNumber=20260811||20260811||1||20260811||N
InpSlippage=20||20||1||200||N
InpMaxOpenPositions=3||1||1||5||Y
InpMaxTradesPerDay=6||6||1||6||N
InpTrendTF=16385||0||0||49153||N
InpEmaFast=50||50||1||500||N
InpEmaSlow=200||200||1||2000||N
InpAdxPeriod=14||14||1||140||N
; ADX threshold and ATR fakeout buffer are fixed at 20.0 / 0.30 - manual
; testing already showed loosening either one wrecks quality (PF < 1), so
; they're excluded from the search to keep the space small and fast.
InpAdxThreshold=20.0||20.0||2.000000||24.000000||N
InpEntryTF=15||0||0||49153||N
InpDonchianPeriod=10||8||2||18||Y
InpAtrPeriod=14||14||1||140||N
InpAtrBufferMult=0.30||0.30||0.100000||0.400000||N
InpAtrSlMult=1.5||1.5||0.150000||15.000000||N
InpRiskReward=1.8||1.8||0.180000||18.000000||N
InpUseTrailing=true||false||0||true||N
InpTrailAtrMult=1.2||1.2||0.120000||12.000000||N
InpSessionStartHour=8||6||2||10||Y
InpSessionEndHour=23||21||1||23||Y
InpAvoidFriday=true||false||0||true||N
InpFridayCutoffHour=20||20||1||200||N
InpAvoidSunday=true||false||0||true||N
InpMaxSpreadPoints=350.0||350.0||35.000000||3500.000000||N
