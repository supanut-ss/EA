; ===================================================================
; MT5 Strategy Tester - headless optimization (IN-SAMPLE) for
; XAUUSD_RSI_MACD_Momentum_EA. Walk-forward step 1 of 2: find good
; parameters on 2026.01.01-2026.06.30 only; step 2 verifies them on
; the untouched 2026.07.01-2026.09.16 window (separate ini).
;
; Kept to a SMALL exhaustive search (27 combos, Optimization=1 complete
; algorithm) rather than the genetic algorithm - this repo's own notes
; (tester_config_optimize.ini) record genetic optimization stalling at
; ~2% here due to RAM pressure across multiple local agents; a small
; complete search avoids that risk.
; ===================================================================

[Tester]
Expert=XAUUSD_RSI_MACD_Momentum_EA
Symbol=XAUUSD
Period=M1
Model=4
FromDate=2026.01.01
ToDate=2026.06.30
ForwardMode=0
Deposit=1000
Currency=USD
Leverage=100
ExecutionMode=0
; Optimization: 0=disabled 1=slow complete algorithm 2=fast genetic algorithm
Optimization=1
; OptimizationCriterion: 0=Balance max 1=Profit Factor max 2=Expected Payoff max
; 3=Drawdown min 4=Balance/Drawdown max 5=Custom(OnTester) 6=Complex Criterion max
OptimizationCriterion=4
Report=XAUUSD_RSI_MACD_Momentum_Optimize_InSample
ReplaceReport=1
ShutdownTerminal=1
Visual=0

; value||start||step||stop||Y-or-N  (Y = included in the optimization search)
[TesterInputs]
InpMagicNumber=20260918||20260918||1||20260918||N
InpSlippage=30||30||1||30||N
InpMaxOpenPositions=1||1||1||1||N
InpMaxTradesPerDay=10||10||1||10||N
InpMacdFastEma=7||7||1||7||N
InpMacdSlowEma=26||26||1||26||N
InpMacdSignal=9||9||1||9||N
InpBbPeriod=20||20||1||20||N
InpBbDeviation=2.0||2.0||0.1||2.0||N
InpBbWidthAvgLookback=50||50||1||50||N
InpBbWidthSqueezePct=50.0||50.0||10.0||50.0||N
InpRsiPeriod=7||7||1||7||N
InpRsiExtremeLow=15.0||10.0||5.0||20.0||Y
InpRsiExtremeHigh=85.0||80.0||5.0||90.0||Y
InpSwingFractalN=2||2||1||2||N
InpRsiDivergenceMinGap=3.0||3.0||1.0||3.0||N
InpConfirmTF=1||1||1||1||N
InpObvLookback=3||3||1||3||N
InpRiskPctTriggerA=0.5||0.5||0.1||0.5||N
InpRiskPctTriggerB=1.0||1.0||0.1||1.0||N
InpAtrPeriod=14||14||1||14||N
InpUseTp=true||0||1||1||N
InpTpRrMultiple=2.0||1.5||0.5||2.5||Y
InpDailyLossStopPct=3.0||3.0||0.5||3.0||N
InpMaxConsecutiveLosses=3||3||1||3||N
InpDailyProfitTargetPct=3.0||3.0||0.5||3.0||N
InpProfitTargetStopsTrading=false||0||1||0||N
InpUseEquityCircuitBreaker=true||0||1||1||N
InpMaxEquityDrawdownPct=15.0||15.0||5.0||15.0||N
InpSessionStartHour=7||7||1||7||N
InpSessionEndHour=23||23||1||23||N
InpAvoidSunday=true||0||1||1||N
InpFlattenBufferMinutes=20||20||5||20||N
InpFridayFallbackCutoffHour=20||20||1||20||N
InpUseBrokerSessionGuard=true||0||1||1||N
InpMaxSpreadPoints=300||300||10||300||N
InpShowComment=true||0||1||1||N
InpVerboseLogging=false||0||1||0||N
