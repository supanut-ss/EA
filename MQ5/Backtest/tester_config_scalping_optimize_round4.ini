; ===================================================================
; MT5 Strategy Tester - headless GENETIC OPTIMIZATION (round 4) for the
; XAUUSD Scalping & Session EA. Used via:
;   terminal64.exe /config:tester_config_scalping_optimize_round4.ini
;
; Round 3 (widened 5 params that hit round-2 edges) found the raw #1 pass
; is overfit: top ~50 passes by score all collapse into the SAME 39-trade
; outcome regardless of InpAtrSlMultTrend/InpMaxBarsInTrade/
; InpRsiPullbackDeepLow value (those params never bind - looks like zero
; trend-mode trades happened at all in that pocket). More robust picks
; (Trades>=100/200) beat round 2 on Profit Factor and Max DD, but both
; still land InpAtrSlMultRange=0.4 - the exact FLOOR of round 3's range
; (already lowered once from round 2's 0.8 floor). Round 4 narrows focus
; to just that one parameter and pushes the floor down further to see if
; the true optimum lies below 0.4. Every other parameter is now FIXED at
; the round-3 robust-candidate (Pass 2180, Trades>=200) values instead of
; re-searched, so this run isolates ATR SL multiplier's effect cleanly.
; ===================================================================

[Tester]
Expert=XAUUSD_Scalping_EA
Symbol=XAUUSD
Period=M5
; Model: 0=Every tick  1=1-minute OHLC  2=Open prices only  3=Math calculations  4=Every tick (based on real ticks)
Model=4
FromDate=2026.02.11
ToDate=2026.08.11
ForwardMode=0
Deposit=1000
Currency=USD
Leverage=100
ExecutionMode=0
; Optimization: 0=disabled 1=slow complete algorithm 2=fast genetic algorithm
Optimization=2
; OptimizationCriterion: 5=Custom max (uses EA's OnTester() return value)
OptimizationCriterion=5
Report=XAUUSD_Scalping_Optimize_Round4
ReplaceReport=1
ShutdownTerminal=1
Visual=0

; value||start||step||stop||Y-or-N  (Y = included in the optimization search)
; Everything except InpAtrSlMultRange is pinned to the round-3 robust pick
; (Pass 2180, Trades=218, PF=1.62, DD=3.30%) so this run isolates just the
; one parameter under investigation.
[TesterInputs]
