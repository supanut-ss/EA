; ===================================================================
; MT5 Strategy Tester - headless config for XAUUSD Scalping & Session EA
; Used via:  terminal64.exe /config:tester_config_scalping.ini
;
; SECURITY: do NOT put your account password in this file if this
; folder is committed to git. Leave Password commented out - as long
; as this MT5 terminal already has the account logged in / remembers
; it, the tester can normally still run using cached login + cached
; history. If MT5 insists on a password, set it locally only and add
; this file to .gitignore before committing anything else.
; ===================================================================

[Tester]
Expert=XAUUSD_Scalping_EA
Symbol=XAUUSD
Period=M5
; Model: 0=Every tick  1=1-minute OHLC  2=Open prices only  3=Math calculations  4=Every tick (based on real ticks)
Model=4
FromDate=2026.01.01
ToDate=2026.08.13
ForwardMode=0
Deposit=1000
Currency=USD
Leverage=100
ExecutionMode=0
Optimization=0
Report=XAUUSD_Scalping_Report
ReplaceReport=1
ShutdownTerminal=1
Visual=0

; Explicit inputs - MT5 silently prefers MQL5\Profiles\Tester\<Expert>.set
; (auto-saved from the previous run) over compiled-in defaults whenever this
; section is absent, so every parameter used by the EA must be listed here
; to guarantee the test actually uses what this file says.
[TesterInputs]
InpLotSize=0.01
InpMagicNumber=20260812
InpSlippage=20
InpMaxOpenPositions=1
InpMaxTradesPerDayTrend=15
InpMaxTradesPerDayChoppy=8
InpRegimeTF=16385
InpAdxPeriod=14
InpAdxThreshold=30.0
InpEmaFastH1=50
InpEmaSlowH1=200
InpEntryTF=5
InpEmaFastM5=20
InpRsiPeriod=14
InpRsiPullbackLow=45.0
InpRsiPullbackHigh=55.0
InpRsiPullbackDeepLow=20.0
InpRsiPullbackDeepHigh=55.0
InpPullbackLookbackBars=6
InpBbPeriod=20
InpBbDeviation=2.5
InpRsiOversold=40.0
InpRsiOverbought=80.0
InpAtrPeriod=14
InpAtrSlMultTrend=1.0
InpAtrSlMultRange=0.6
InpRiskReward=1.6
InpMaxBarsInTrade=24
InpUseBreakeven=true
InpBETriggerAtrMult=0.8
InpBELockPoints=20
InpUseTrailing=true
InpTrailAtrMult=1.0
InpUseDailyLossGuard=true
InpMaxDailyLosses=4
InpUseLossCooldown=true
InpLossCooldownMins=45
InpMaxSpreadPoints=200.0
InpAvoidSunday=true
InpUseSymbolSessionTrade=true
InpFlattenBufferMinutes=20
InpFridayFallbackCutoffHour=20
