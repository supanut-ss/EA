; ===================================================================
; MT5 Strategy Tester - headless config for XAUUSD_COUNTER_TREND EA
; Long-range backtest over the FULL history this broker/account has
; cached for XAUUSD (real data begins 2016.11.22 - true 15y back to
; 2011 is not available on this account, confirmed via the terminal
; log's "XAUUSD: history data begins from 2016.11.22 00:00").
; Used via:  terminal64.exe /config:tester_config_counter_trend_15y.ini
;
; Same [TesterInputs] as tester_config_counter_trend.ini (the user's
; tuned v2.22 profile) - only [Tester] date range / Report differ.
;
; Model=4 ("Every tick based on real ticks", MT5's synthetic-tick
; generator from M1 OHLC) - NOT Model=1. A first attempt with Model=1
; (1-minute OHLC) left BarsCalculated(ema_handle) stuck below 200 for
; literally every one of 368,296 M5 bars across the whole run (EMA
; filter permanently blocked, zero trades) - a reproducible MT5 tester
; quirk with this symbol's low (59%) M1 history quality under the OHLC
; model. Model=4 does not have this problem and is what every prior
; working report (v2_22/v2_23 6m reports) used.
;
; SECURITY: do NOT put your account password in this file if this
; folder is committed to git.
; ===================================================================

[Tester]
Expert=XAUUSD_COUNTER_TREND
Symbol=XAUUSD
Period=M5
; Model: 0=Every tick  1=1-minute OHLC  2=Open prices only  3=Math calculations  4=Every tick (based on real ticks)
